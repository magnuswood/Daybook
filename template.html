<title>The Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap">
<style>
/* Layout: a news app. Sticky masthead and section tabs, lead story with full-bleed photo, then a card grid and a quieter list. */
:root {
  --bg: #f2f3f5;
  --card: #ffffff;
  --ink: #111418;
  --muted: #5d6570;
  --line: #e1e4e8;
  --accent: #b3122e;
  --chip: #e8eaee;
  --shadow: 0 1px 2px rgba(17,20,24,.06), 0 4px 14px rgba(17,20,24,.05);
  --serif: "Newsreader", "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d0f12; --card: #171a1f; --ink: #eef0f3; --muted: #9aa3ae; --line: #262b32;
  --accent: #ff4d5e; --chip: #232830; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d0f12; --card: #171a1f; --ink: #eef0f3; --muted: #9aa3ae; --line: #262b32;
  --accent: #ff4d5e; --chip: #232830; --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased }
a { color: inherit; text-decoration: none }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }

.top { border-bottom: 1px solid var(--line) }
.wrap { max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#refresh { border: 1px solid var(--ink); background: none; color: var(--ink); font: 600 11px var(--sans);
  letter-spacing: .08em; text-transform: uppercase; padding: 4px 9px; border-radius: 3px; cursor: pointer }
#refresh:disabled { color: var(--muted); border-color: var(--line); cursor: default }
.note { color: var(--muted); font-size: 13px; padding-bottom: 10px }
.mast { padding-block: 16px 6px }
.mast h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: 32px; line-height: 1.1; letter-spacing: -.01em }
.dateline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 2px 12px; color: var(--muted);
  font: 600 13px var(--sans); text-transform: uppercase; letter-spacing: .06em; font-variant-numeric: tabular-nums }
.dateline .right { display: flex; align-items: center; gap: 10px }
.side { display: flex; align-items: center; gap: 10px }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 10px; margin: 0 -4px; padding-inline: 4px }
.tabs::-webkit-scrollbar { display: none }
.tabs button { flex: none; border: 0; background: var(--chip); color: var(--ink); font: 600 14px var(--sans);
  padding: 7px 13px; border-radius: 999px; cursor: pointer }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg) }

main { padding-block: 18px 48px }
.sec { display: grid; gap: 16px; margin-bottom: 34px }
.sechead { display: flex; align-items: baseline; justify-content: space-between; border-top: 2px solid var(--ink); padding-top: 8px }
.sechead h2 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 700 }
.sechead button { border: 0; background: none; color: var(--accent); font: 600 14px var(--sans); cursor: pointer; padding: 4px 0 }

.card { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0 }
.card .pic { aspect-ratio: 16 / 9; width: 100%; max-width: 100%; object-fit: cover; display: block; background: var(--chip) }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; min-width: 0 }
.src { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent) }
.card h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.22; text-wrap: balance }
.card p { margin: 0; color: var(--muted); font-size: 14px }
.meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }

.lead h3 { font-size: clamp(24px, 4.2vw, 36px); line-height: 1.12; font-weight: 700; letter-spacing: -.005em }
.lead p { font-size: 16px; max-width: 62ch }
.lead .body { padding: 16px 18px 18px; gap: 8px }
@media (min-width: 820px) {
  .lead { flex-direction: row }
  .lead .pic { width: 62%; aspect-ratio: auto; min-height: 340px }
  .lead .body { width: 38%; align-content: center; padding: 24px }
}

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)) }
.list { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden }
.row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); align-items: start }
.row:first-child { border-top: 0 }
.row > div { display: grid; gap: 4px; min-width: 0 }
.row h3 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 17px; line-height: 1.25 }
.row img { width: 92px; height: 92px; object-fit: cover; border-radius: 10px; background: var(--chip) }
.card:hover h3, .row:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px }
@media (max-width: 600px) {
  .grid { gap: 10px }
  .grid .card { flex-direction: row-reverse; align-items: flex-start; gap: 0 }
  .grid .card .pic { width: 104px; height: 104px; aspect-ratio: auto; flex: none; margin: 12px 12px 12px 0; border-radius: 10px }
  .grid .card .body { flex: 1; padding: 12px 12px 12px 14px }
  .grid .card h3 { font-size: 17px }
}
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px }
.jump button { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 13px var(--sans);
  padding: 6px 12px; border-radius: 999px; cursor: pointer }
.sec { scroll-margin-top: 16px }
.row p { margin: 0; color: var(--muted); font-size: 14px }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.bar button { border: 0; background: none; color: var(--muted); font: 600 11px var(--sans); display: grid; justify-items: center; gap: 3px;
  padding: 4px 0; cursor: pointer }
.bar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.bar button[aria-current="page"] { color: var(--accent) }
.bar button:disabled { opacity: .5 }
.bar .spin svg { animation: spin 1.2s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .bar .spin svg { animation: none } }
@media (max-width: 819px) { #refresh { display: none } }
body { padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)) }
@media (max-width: 819px) { .tabs { display: none } }
@media (min-width: 820px) { .bar { display: none } body { padding-bottom: 0 } }
.empty { color: var(--muted); padding: 20px 0 }
.foot { color: var(--muted); font-size: 12px; text-align: center; padding-block: 8px 24px }
</style>

<header class="top">
  <div class="wrap">
    <div class="mast">
      <h1>The Daybook</h1>
    </div>
    <div class="dateline">
      <span id="date"></span>
      <span class="right"><span id="edition"></span><button type="button" id="refresh" hidden>Refresh</button></span>
    </div>
    <div class="note" id="note" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<nav class="bar" id="bar" aria-label="Sections"></nav>
<div class="wrap foot">Free sources only. Paywalled publishers are filtered out of the searches. Stories open on the publisher's site.</div>

<script>
const DATA = /*__DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return m <= 1 ? "Just now" : m + " min ago";
  const h = Math.round(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d === 1 ? "Yesterday" : d + " days ago";
}
const meta = (x) => `<div class="meta">${ago(x.d)}</div>`;
const link = (x) => `href="${esc(x.u)}" target="_blank" rel="noopener"`;

function lead(x) {
  return `<a class="card lead" ${link(x)}>${x.img ? `<img class="pic" src="${x.img}" alt="">` : ""}
    <div class="body"><div class="src">${esc(x.src)}</div><h3>${esc(x.t)}</h3>${x.s ? `<p>${esc(x.s)}</p>` : ""}${meta(x)}</div></a>`;
}
function card(x) {
  return `<a class="card" ${link(x)}>${x.img ? `<img class="pic" src="${x.img}" alt="" loading="lazy">` : ""}
    <div class="body"><div class="src">${esc(x.src)}</div><h3>${esc(x.t)}</h3>${!x.img && x.s ? `<p>${esc(x.s)}</p>` : ""}${meta(x)}</div></a>`;
}
function row(x, withSummary) {
  return `<a class="row" ${link(x)}><div><div class="src">${esc(x.src)}</div><h3>${esc(x.t)}</h3>${withSummary && x.s ? `<p>${esc(x.s)}</p>` : ""}${meta(x)}</div>
    ${x.img ? `<img src="${x.img}" alt="" loading="lazy">` : ""}</a>`;
}

function sectionFull(s) {
  if (!s.items.length) return `<p class="empty">Nothing came through from these feeds on the last update.</p>`;
  const [first, ...rest] = s.items;
  const withPic = rest.filter((x) => x.img);
  const gridItems = (withPic.length >= 3 ? withPic : rest).slice(0, 6);
  const listItems = rest.filter((x) => !gridItems.includes(x));
  return `<section class="sec">${first.img ? lead(first) : card(first)}
    ${gridItems.length ? `<div class="grid">${gridItems.map(card).join("")}</div>` : ""}
    ${listItems.length ? `<div class="list">${listItems.map(row).join("")}</div>` : ""}</section>`;
}
const LISTS = { genx: false, writers: true };
function sectionBody(s) {
  if (!s.items.length) return `<p class="empty">Nothing came through from these feeds on the last update.</p>`;
  if (s.key in LISTS) return `<div class="list">${s.items.map((x) => row(x, LISTS[s.key])).join("")}</div>`;
  return sectionFull(s).replace(/^<section class="sec">|<\/section>$/g, "");
}
const head = (s, more) => `<div class="sechead"><h2>${esc(s.label)}</h2>${more ? `<button type="button" data-go="${s.key}">More ›</button>` : ""}</div>`;

const GROUPS = [
  { key: "today", label: "Today", icon: '<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>' },
  { key: "news", label: "News", sections: ["uk", "world"], icon: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 2.5 14.4 0 17M12 3.5c-2.5 2.6-2.5 14.4 0 17"/>' },
  { key: "topics", label: "Topics", sections: ["environment", "technology", "ai", "work"], icon: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>' },
  { key: "reading", label: "Reading", sections: ["writers", "diary", "genx"], icon: '<path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/>' },
];
const sec = (k) => DATA.sections.find((x) => x.key === k);
const groupOf = (k) => GROUPS.find((g) => g.key === k || (g.sections || []).includes(k)) || GROUPS[0];

function today() {
  return DATA.sections.filter((s) => s.items.length).map((s, i) => {
    let body;
    if (i === 0) body = lead(s.items[0]) + `<div class="grid">${s.items.slice(1, 4).map(card).join("")}</div>`;
    else if (s.key in LISTS) body = `<div class="list">${s.items.slice(0, 3).map((x) => row(x, LISTS[s.key])).join("")}</div>`;
    else body = `<div class="grid">${s.items.slice(0, 3).map(card).join("")}</div>`;
    return `<section class="sec">${head(s, true)}${body}</section>`;
  }).join("");
}
function groupPage(g) {
  const list = g.sections.map(sec).filter(Boolean);
  const jump = `<div class="jump">${list.map((s) => `<button type="button" data-jump="${s.key}">${esc(s.label)}</button>`).join("")}</div>`;
  return jump + list.map((s) => `<section class="sec" id="s-${s.key}">${head(s, false)}${sectionBody(s)}</section>`).join("");
}
function show(key, scrollTo) {
  const g = groupOf(key);
  document.querySelectorAll("[data-group]").forEach((b) => b.toggleAttribute("aria-current", false));
  document.querySelectorAll(`[data-group="${g.key}"]`).forEach((b) => b.setAttribute("aria-current", "page"));
  $("#main").innerHTML = g.key === "today" ? today() : groupPage(g);
  const target = scrollTo || (key !== g.key ? key : null);
  if (target) document.getElementById("s-" + target)?.scrollIntoView();
  else window.scrollTo({ top: 0 });
}
const navButtons = (withIcon) => GROUPS.map((g) => `<button type="button" data-group="${g.key}">${withIcon ? `<svg viewBox="0 0 24 24" aria-hidden="true">${g.icon}</svg>` : ""}${esc(g.label)}</button>`).join("");

function init() {
  if (!DATA) { $("#main").innerHTML = `<p class="empty">No stories loaded yet.</p>`; return; }
  const b = new Date(DATA.built);
  const sameDay = b.toDateString() === new Date().toDateString();
  $("#date").textContent = b.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/London" });
  $("#edition").textContent = "Updated " + (sameDay ? "" : b.toLocaleDateString("en-GB", { weekday: "short" }) + " ")
    + b.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/London" }) 
  $("#tabs").innerHTML = navButtons(false);
  $("#bar").innerHTML = navButtons(true) + `<button type="button" id="refresh-bar" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>Refresh</span></button>`;
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-group],[data-go],[data-jump]");
    if (!t) return;
    if (t.dataset.group) show(t.dataset.group);
    else if (t.dataset.go) show(t.dataset.go);
    else document.getElementById("s-" + t.dataset.jump)?.scrollIntoView({ behavior: "smooth" });
  });
  show((location.hash || "").slice(1) || "today");
}
init();

// Outside Claude (home-screen app): reload when reopened after half an hour, so it shows the latest hourly build.
if (!window.claude) {
  let hiddenAt = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (hiddenAt && Date.now() - hiddenAt > 30 * 60000) location.reload();
  });
}

// Refresh: asks the scheduled task to rebuild now; the page reloads itself when the new version lands.
const TRIGGER = "trig_01QkFg2TkdLNK2mk9Y7A72Si";
(async () => {
  let mcp = null;
  try { mcp = await window.claude?.use?.("mcp"); } catch (e) {}
  if (!mcp) return;
  const btns = [$("#refresh"), $("#refresh-bar")], note = $("#note");
  btns.forEach((b) => { b.hidden = false; });
  const say = (t) => { note.textContent = t; note.hidden = !t; window.scrollTo({ top: 0 }); };
  const setBusy = (busy) => btns.forEach((b) => {
    b.disabled = busy; b.classList.toggle("spin", busy);
    const label = b.querySelector("span") || b; label.textContent = busy ? "Refreshing…" : "Refresh";
  });
  const go = async () => {
    setBusy(true);
    say("Fetching the latest stories. The page updates itself in about two minutes.");
    try {
      await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: TRIGGER });
    } catch (e) {
      setBusy(false);
      const c = e && e.code;
      if (c === "server_not_connected" || c === "needs_reauth") say("Refresh needs the Claude Code Remote connector. Reconnect it in claude.ai Settings, Connectors.");
      else if (c === "not_in_manifest" || c === "approval_required" || c === "not_granted") say("Refresh needs your permission. Tap Refresh again and choose Allow.");
      else if (c === "server_unavailable" || c === "upstream_error") say("The refresh may have started but did not confirm. If nothing changes in a few minutes, tap Refresh again.");
      else say("Refresh did not start (" + (c || "unknown error") + "). The next scheduled update still runs.");
    }
  };
  btns.forEach((b) => b.addEventListener("click", go));
})();
</script>
